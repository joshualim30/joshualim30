# Generates the contribution snake as an SVG and commits it to an `output` branch.
#
# WHY A BRANCH AND NOT AN IMAGE HOST
# Every other animated contribution graph is a URL to somebody else's server, rendered fresh on
# every page view. Three of the four services this profile used to depend on are now dead — one
# 404s, one 503s under rate limiting, one returns 402 Payment Required. This renders once a day,
# on GitHub's runners, and commits the result. The README then points at a file in this
# repository, so the animation is as reliable as GitHub itself.
#
# The `output` branch exists only to hold generated SVGs. Nothing reads it but the README, and
# keeping it off `main` means the daily commit never touches the branch you actually work in.

name: Generate contribution snake

on:
    schedule:
        - cron: '30 5 * * *'
    workflow_dispatch:
    push:
        branches: [main]
        paths:
            - '.github/workflows/snake.yml'

permissions:
    contents: write

concurrency:
    group: snake
    cancel-in-progress: true

jobs:
    snake:
        runs-on: ubuntu-latest
        steps:
            - name: Render
              uses: Platane/snk@v3
              id: snake
              with:
                  github_user_name: ${{ github.repository_owner }}
                  # Two files: one for each colour scheme, matched by the <picture> element in
                  # the README so the snake is legible on both GitHub themes.
                  # Coloured to the README's own palette rather than left on GitHub's greens,
                  # so the animation belongs to the page instead of sitting on top of it. The
                  # dot ramp runs from the page background up to the accent, which is what makes
                  # the snake read as eating the graph rather than passing over it.
                  outputs: |
                      dist/snake.svg?color_snake=%237FC4FF&color_dots=%23e8eef2,%23bcd4e6,%238fb8d8,%235b93c4,%232c5364
                      dist/snake-dark.svg?color_snake=%237FC4FF&color_dots=%230a161d,%231b3543,%232f5a6e,%234e8ba6,%237FC4FF

            - name: Publish to the output branch
              uses: crazy-max/ghaction-github-pages@v4
              with:
                  target_branch: output
                  build_dir: dist
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
